<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <link rel="stylesheet" href="css/leaflet.css?v=2.0">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css?v=2.0">
        <link rel="stylesheet" href="css/qgis2web.css?v=2.0">
        <link rel="stylesheet" href="css/fontawesome-all.min.css?v=2.0">
        <link rel="stylesheet" href="css/leaflet.photon.css?v=2.0">
        <link rel="stylesheet" href="css/leaflet-measure.css?v=2.0">
        
        <style>
        /* Pantalla completa */
        html, body {
            width: 100% !important;
            height: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }

        #map {
            position: absolute !important;
            top: 0 !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* DISEÑO MODERNO DE PANEL DE CAPAS Y LEYENDA */
        .leaflet-control-layers,
        .leaflet-touch .leaflet-control-layers,
        .leaflet-control-layers-expanded {
            background: rgba(255, 255, 255, 0.90) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(226, 232, 240, 0.8) !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15) !important;
            padding: 12px 16px !important;
            color: #1e293b !important;
        }

        .leaflet-control-layers-overlays label,
        .leaflet-control-layers-base label {
            display: flex !important;
            align-items: center !important;
            margin-bottom: 8px !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            color: #334155 !important;
            cursor: pointer !important;
        }

        .leaflet-control-layers input[type="checkbox"],
        .leaflet-control-layers input[type="radio"] {
            accent-color: #2563eb !important;
            width: 16px !important;
            height: 16px !important;
            margin-right: 8px !important;
            cursor: pointer !important;
        }

        .leaflet-control-layers-separator {
            border-top: 1px solid #e2e8f0 !important;
            margin: 10px 0 !important;
        }

        /* DISEÑO MODERNO DE BOTONES DE CONTROL (ZOOM Y MEDIDA) */
        .leaflet-bar {
            border: none !important;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12) !important;
            border-radius: 8px !important;
            overflow: hidden !important;
        }

        .leaflet-bar a {
            background-color: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(8px) !important;
            color: #334155 !important;
            border-bottom: 1px solid #f1f5f9 !important;
            transition: background-color 0.2s ease !important;
        }

        .leaflet-bar a:hover {
            background-color: #f8fafc !important;
            color: #2563eb !important;
        }
        </style>
        <title>Mapa Interactivo - Caucasia</title>
    </head>
    <body>
        <div id="map"></div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="data/DRENAJESCACUASIA_2.js"></script>
        <script src="data/LAGUNASCAUCASIA_3.js"></script>
        <script src="data/CIENAGASCAUCASIA_4.js"></script>
        <script src="data/RIOCAUCA_5.js"></script>
        <script src="data/PANTANOSCAUCASIA_6.js"></script>
        <script src="data/BARRIOSCAUCASIA_7.js"></script>
        <script src="data/CUENCASALCANTARILLADO_8.js"></script>
        
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        });
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() { popup.update(); });
                            img.addEventListener('error', function() { popup.update(); });
                        }
                    }
                }
            }
        }

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);

        var bounds_group = new L.featureGroup([]);

        // CAPAS BASE
        map.createPane('pane_OSMStandard_0');
        map.getPane('pane_OSMStandard_0').style.zIndex = 400;
        var layer_OSMStandard_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OSMStandard_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1, maxZoom: 28
        });

        map.createPane('pane_GoogleSatellite_1');
        map.getPane('pane_GoogleSatellite_1').style.zIndex = 401;
        var layer_GoogleSatellite_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 1, maxZoom: 28
        });
        map.addLayer(layer_GoogleSatellite_1);

        // CAPAS VECTORIALES
        function pop_DRENAJESCACUASIA_2(feature, layer) {
            var popupContent = '<table><tr><td colspan="2">' + (feature.properties['SECTOR'] !== null ? autolinker.link(String(feature.properties['SECTOR'])) : '') + '</td></tr></table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.bindPopup(content, { maxHeight: 400 });
        }
        var layer_DRENAJESCACUASIA_2 = new L.geoJson(json_DRENAJESCACUASIA_2, {
            onEachFeature: pop_DRENAJESCACUASIA_2,
            style: function() { return { color: 'rgba(0,145,255,1.0)', weight: 2.0 }; }
        });
        bounds_group.addLayer(layer_DRENAJESCACUASIA_2);
        map.addLayer(layer_DRENAJESCACUASIA_2);

        var layer_LAGUNASCAUCASIA_3 = new L.geoJson(json_LAGUNASCAUCASIA_3, {
            style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(114,155,111,1.0)', fillOpacity: 1 }; }
        });
        bounds_group.addLayer(layer_LAGUNASCAUCASIA_3);
        map.addLayer(layer_LAGUNASCAUCASIA_3);

        var layer_CIENAGASCAUCASIA_4 = new L.geoJson(json_CIENAGASCAUCASIA_4, {
            style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(255,139,18,1.0)', fillOpacity: 1 }; }
        });
        bounds_group.addLayer(layer_CIENAGASCAUCASIA_4);
        map.addLayer(layer_CIENAGASCAUCASIA_4);

        var layer_RIOCAUCA_5 = new L.geoJson(json_RIOCAUCA_5, {
            style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(184,155,107,1.0)', fillOpacity: 1 }; }
        });
        bounds_group.addLayer(layer_RIOCAUCA_5);
        map.addLayer(layer_RIOCAUCA_5);

        var layer_PANTANOSCAUCASIA_6 = new L.geoJson(json_PANTANOSCAUCASIA_6, {
            style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(152,125,183,1.0)', fillOpacity: 1 }; }
        });
        bounds_group.addLayer(layer_PANTANOSCAUCASIA_6);
        map.addLayer(layer_PANTANOSCAUCASIA_6);

        var layer_BARRIOSCAUCASIA_7 = new L.geoJson(json_BARRIOSCAUCASIA_7, {
            style: function() { return { color: 'rgba(35,35,35,1.0)', weight: 1.0, fillOpacity: 0.2 }; }
        });
        bounds_group.addLayer(layer_BARRIOSCAUCASIA_7);
        map.addLayer(layer_BARRIOSCAUCASIA_7);

        var layer_CUENCASALCANTARILLADO_8 = new L.geoJson(json_CUENCASALCANTARILLADO_8, {
            style: function() { return { color: 'rgba(227,26,28,1.0)', weight: 2.0, fillOpacity: 0.2 }; }
        });
        bounds_group.addLayer(layer_CUENCASALCANTARILLADO_8);
        map.addLayer(layer_CUENCASALCANTARILLADO_8);

        // --- CONTROL DE CAPAS (BASE Y SUPERPUESTAS) ---
        var baseMaps = {
            "Google Satellite": layer_GoogleSatellite_1,
            "OpenStreetMap": layer_OSMStandard_0
        };

        var overlayMaps = {
            "Cuencas Alcantarillado": layer_CUENCASALCANTARILLADO_8,
            "Barrios Caucasia": layer_BARRIOSCAUCASIA_7,
            "Pantanos Caucasia": layer_PANTANOSCAUCASIA_6,
            "Río Cauca": layer_RIOCAUCA_5,
            "Ciénagas Caucasia": layer_CIENAGASCAUCASIA_4,
            "Lagunas Caucasia": layer_LAGUNASCAUCASIA_3,
            "Drenajes Caucasia": layer_DRENAJESCACUASIA_2
        };

        var layerControl = L.control.layers(baseMaps, overlayMaps, {
            collapsed: false,
            position: 'topright'
        }).addTo(map);

        if (bounds_group.getLayers().length) {
            map.fitBounds(bounds_group.getBounds());
        }
        </script>
    </body>
</html>
