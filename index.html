<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <!-- Hojas de estilo externas con Cache Busting -->
        <link rel="stylesheet" href="css/leaflet.css?v=9.0">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css?v=9.0">
        <link rel="stylesheet" href="css/qgis2web.css?v=9.0">
        <link rel="stylesheet" href="css/fontawesome-all.min.css?v=9.0">
        <link rel="stylesheet" href="css/leaflet.photon.css?v=9.0">
        <link rel="stylesheet" href="css/leaflet-measure.css?v=9.0">
        
        <style>
        /* Pantalla completa */
        html, body {
            width: 100% !important;
            height: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }

        #map {
            position: absolute !important;
            top: 55px !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            height: calc(100% - 55px) !important;
        }

        /* BARRA SUPERIOR COMPLETA Y ADOSADA */
        .map-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55px;
            z-index: 2000;
            background: #1D52A0;
            border-bottom: 3px solid #009EE2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
            gap: 12px;
        }

        .map-header img {
            height: 34px;
            width: auto;
            object-fit: contain;
            background: #ffffff;
            padding: 3px 6px;
            border-radius: 6px;
        }

        .header-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .header-subtitle {
            font-size: 11px;
            color: #009EE2;
            margin-top: 1px;
            font-weight: 600;
        }

        /* AGROPAMIENTO EN BARRA LATERAL FLOTANTE DERECHA */
        .leaflet-top.leaflet-right {
            top: 15px !important;
            right: 15px !important;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .leaflet-control {
            margin: 0 !important;
            border: none !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15) !important;
            border-radius: 10px !important;
            overflow: hidden !important;
        }

        /* ICONO DE CAPAS EN LA BARRA LATERAL */
        .leaflet-control-layers {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(29, 82, 160, 0.3) !important;
            border-radius: 10px !important;
            color: #1D52A0 !important;
        }

        .leaflet-control-layers-toggle {
            background-image: none !important;
            background-color: #ffffff !important;
            width: 40px !important;
            height: 40px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-decoration: none !important;
        }

        .leaflet-control-layers-toggle::before {
            font-family: "Font Awesome 5 Free" !important;
            font-weight: 900 !important;
            content: "\f5fd" !important; /* Icono layer-group */
            font-size: 18px !important;
            color: #1D52A0 !important;
        }

        .leaflet-control-layers-toggle:hover::before {
            color: #009EE2 !important;
        }

        .leaflet-control-layers-overlays label,
        .leaflet-control-layers-base label {
            display: flex !important;
            align-items: center !important;
            margin-bottom: 8px !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            color: #1D52A0 !important;
            cursor: pointer !important;
            transition: background-color 0.2s ease !important;
            padding: 4px 6px !important;
            border-radius: 6px !important;
            text-transform: uppercase !important;
        }

        .leaflet-control-layers-overlays label:hover,
        .leaflet-control-layers-base label:hover {
            background-color: rgba(0, 158, 226, 0.1) !important;
        }

        .leaflet-control-layers input[type="checkbox"],
        .leaflet-control-layers input[type="radio"] {
            accent-color: #009EE2 !important;
            width: 16px !important;
            height: 16px !important;
            margin-right: 8px !important;
            cursor: pointer !important;
        }

        .leaflet-control-layers-separator {
            border-top: 1px solid rgba(29, 82, 160, 0.2) !important;
            margin: 10px 0 !important;
        }

        /* ESTILO PARA LOS DEMÁS BOTONES DE LA BARRA LATERAL (ZOOM Y MEDIDA) */
        .leaflet-bar a {
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            background-color: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(8px) !important;
            color: #1D52A0 !important;
            border-bottom: 1px solid #f1f5f9 !important;
            transition: background-color 0.2s ease, color 0.2s ease !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .leaflet-bar a:hover {
            background-color: #009EE2 !important;
            color: #ffffff !important;
        }

        /* POPUPS */
        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(8px) !important;
            border-radius: 12px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2) !important;
            border: 1px solid #009EE2 !important;
        }
        </style>
        <title>GEOPORTAL - AGUASCOL</title>
    </head>
    <body>
        <!-- BARRA SUPERIOR COMPLETA -->
        <div class="map-header">
            <img src="LOGO.png" alt="AGUASCOL LOGO">
            <div>
                <div class="header-title">GEOPORTAL - AGUASCOL</div>
                <div class="header-subtitle">MUNICIPIO DE CAUCASIA</div>
            </div>
        </div>

        <div id="map"></div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="data/DRENAJESCACUASIA_2.js"></script>
        <script src="data/LAGUNASCAUCASIA_3.js"></script>
        <script src="data/CIENAGASCAUCASIA_4.js"></script>
        <script src="data/RIOCAUCA_5.js"></script>
        <script src="data/PANTANOSCAUCASIA_6.js"></script>
        <script src="data/BARRIOSCAUCASIA_7.js"></script>
        <script src="data/CUENCASALCANTARILLADO_8.js"></script>
        
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        });
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        // HERRAMIENTAS UBICADAS EN LA BARRA LATERAL FLOTANTE DERECHA ('topright')
        var zoomControl = L.control.zoom({ position: 'topright' }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topright',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);

        var bounds_group = new L.featureGroup([]);

        // CAPAS BASE
        map.createPane('pane_OSMStandard_0');
        map.getPane('pane_OSMStandard_0').style.zIndex = 400;
        var layer_OSMStandard_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OSMStandard_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1, maxZoom: 28
        });

        map.createPane('pane_GoogleSatellite_1');
        map.getPane('pane_GoogleSatellite_1').style.zIndex = 401;
        var layer_GoogleSatellite_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 1, maxZoom: 28
        });
        map.addLayer(layer_GoogleSatellite_1);

        // CAPAS VECTORIALES
        function pop_DRENAJESCACUASIA_2(feature, layer) {
            var popupContent = '<table><tr><td colspan="2">' + (feature.properties['SECTOR'] !== null ? autolinker.link(String(feature.properties['SECTOR'])) : '') + '</td></tr></table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.bindPopup(content, { maxHeight: 400 });
        }
        var layer_DRENAJESCACUASIA_2 = new L.geoJson(json_DRENAJESCACUASIA_2, {
            onEachFeature: pop_DRENAJESCACUASIA_2,
            style: function() { return { color: 'rgba(0,158,226,1.0)', weight: 2.0 }; }
        });
        bounds_group.addLayer(layer_DRENAJESCACUASIA_2);
        map.addLayer(layer_DRENAJESCACUASIA_2);

        var layer_LAGUNASCAUCASIA_3 = new L.geoJson(json_LAGUNASCAUCASIA_3, {
            style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(114,155,111,1.0)', fillOpacity: 0.5 }; }
        });
        bounds_group.addLayer(layer_LAGUNASCAUCASIA_3);
        map.addLayer(layer_LAGUNASCAUCASIA_3);

        var layer_CIENAGASCAUCASIA_4 = new L.geoJson(json_CIENAGASCAUCASIA_4, {
            style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(255,139,18,1.0)', fillOpacity: 0.5 }; }
        });
        bounds_group.addLayer(layer_CIENAGASCAUCASIA_4);
        map.addLayer(layer_CIENAGASCAUCASIA_4);

        var layer_RIOCAUCA_5 = new L.geoJson(json_RIOCAUCA_5, {
            style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(184,155,107,1.0)', fillOpacity: 0.5 }; }
        });
        bounds_group.addLayer(layer_RIOCAUCA_5);
        map.addLayer(layer_RIOCAUCA_5);

        var layer_PANTANOSCAUCASIA_6 = new L.geoJson(json_PANTANOSCAUCASIA_6, {
            style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(152,125,183,1.0)', fillOpacity: 0.5 }; }
        });
        bounds_group.addLayer(layer_PANTANOSCAUCASIA_6);
        map.addLayer(layer_PANTANOSCAUCASIA_6);

        var layer_BARRIOSCAUCASIA_7 = new L.geoJson(json_BARRIOSCAUCASIA_7, {
            style: function() { return { color: 'rgba(35,35,35,1.0)', weight: 1.0, fillOpacity: 0.3 }; }
        });
        bounds_group.addLayer(layer_BARRIOSCAUCASIA_7);
        map.addLayer(layer_BARRIOSCAUCASIA_7);

        var layer_CUENCASALCANTARILLADO_8 = new L.geoJson(json_CUENCASALCANTARILLADO_8, {
            style: function() { return { color: 'rgba(227,26,28,1.0)', weight: 2.0, fillOpacity: 0.3 }; }
        });
        bounds_group.addLayer(layer_CUENCASALCANTARILLADO_8);
        map.addLayer(layer_CUENCASALCANTARILLADO_8);

        // CAPAS BASE Y SUPERPUESTAS
        var baseMaps = {
            "GOOGLE SATELLITE": layer_GoogleSatellite_1,
            "OPENSTREETMAP": layer_OSMStandard_0
        };

        var overlayMaps = {
            "CUENCAS ALCANTARILLADO": layer_CUENCASALCANTARILLADO_8,
            "BARRIOS": layer_BARRIOSCAUCASIA_7,
            "PANTANOS": layer_PANTANOSCAUCASIA_6,
            "RÍO CAUCA": layer_RIOCAUCA_5,
            "CIÉNAGAS": layer_CIENAGASCAUCASIA_4,
            "LAGUNAS": layer_LAGUNASCAUCASIA_3,
            "DRENAJES": layer_DRENAJESCACUASIA_2
        };

        // PANEL DE CAPAS DESPLEGABLE EN LA BARRA LATERAL
        var layerControl = L.control.layers(baseMaps, overlayMaps, {
            collapsed: true,
            position: 'topright'
        }).addTo(map);

        if (bounds_group.getLayers().length) {
            map.fitBounds(bounds_group.getBounds());
        }
        </script>
    </body>
</html>
