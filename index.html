<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <!-- Hojas de estilo externas -->
        <link rel="stylesheet" href="css/leaflet.css?v=12.0">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css?v=12.0">
        <link rel="stylesheet" href="css/qgis2web.css?v=12.0">
        <link rel="stylesheet" href="css/fontawesome-all.min.css?v=12.0">
        <link rel="stylesheet" href="css/leaflet.photon.css?v=12.0">
        
        <style>
        html, body {
            width: 100% !important;
            height: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
            font-family: Arial, Helvetica, sans-serif !important;
            background-color: #f8f9fa;
        }

        #map {
            position: absolute !important;
            top: 55px !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            height: calc(100% - 55px) !important;
        }

        /* BARRA SUPERIOR ESTILO ARCGIS / EPM */
        .map-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55px;
            z-index: 2000;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }

        .header-brand img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        /* BOTONES CIRCULARES DE HERRAMIENTAS (VERDES) */
        .header-tools {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #00a859; /* Verde estilo EPM / ArcGIS */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            border: none;
        }

        .tool-btn:hover {
            background-color: #008f4c;
            transform: translateY(-1px);
        }

        .tool-btn i {
            font-size: 15px;
        }

        /* BUSCADOR FLOTANTE DENTRO DEL MAPA */
        .search-container {
            position: absolute;
            top: 15px;
            left: 60px;
            z-index: 1000;
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            border: 1px solid #ccc;
            overflow: hidden;
        }

        .search-container input {
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            width: 220px;
            color: #333;
        }

        .search-container button {
            background: #00a859;
            border: none;
            color: white;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-container button:hover {
            background: #008f4c;
        }

        /* REUBICACIÓN DEL ZOOM A LA IZQUIERDA */
        .leaflet-top.leaflet-left {
            top: 15px !important;
            left: 15px !important;
        }

        .leaflet-bar {
            border: 1px solid #ccc !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15) !important;
            border-radius: 4px !important;
            overflow: hidden !important;
        }

        .leaflet-bar a {
            background-color: #ffffff !important;
            color: #333333 !important;
            font-weight: bold;
        }

        /* PANELES FLOTANTES DESPLEGABLES (CAPAS Y LEYENDA) */
        .floating-panel {
            display: none;
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 1px solid #e0e0e0;
            width: 260px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .floating-panel.active {
            display: block;
        }

        .panel-header {
            background: #f1f3f5;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .panel-close {
            cursor: pointer;
            color: #888;
        }

        .panel-close:hover {
            color: #333;
        }

        .panel-body {
            padding: 12px 14px;
        }

        /* ELEMENTOS DE LEYENDA */
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: #444;
            font-weight: 500;
        }

        .legend-symbol {
            width: 18px;
            height: 12px;
            margin-right: 10px;
            border-radius: 2px;
            display: inline-block;
        }

        .legend-line {
            width: 18px;
            height: 3px;
            margin-right: 10px;
            display: inline-block;
        }

        /* OCULTAR CONTROL NATIVO DE LEAFLET LAYERS */
        .leaflet-control-layers {
            display: none !important;
        }
        </style>
        <title>GEOPORTAL - AGUASCOL</title>
    </head>
    <body>
        <!-- BARRA SUPERIOR (ESTILO EPM/ARCGIS) -->
        <div class="map-header">
            <div class="header-brand">
                <span class="header-title">GEOPORTAL - AGUASCOL</span>
                <img src="LOGO.png" alt="AGUASCOL LOGO">
            </div>
            
            <!-- BOTONES CIRCULARES VERDES EN LA ESQUINA SUPERIOR DERECHA -->
            <div class="header-tools">
                <button class="tool-btn" id="btnLayers" title="Capas de Información">
                    <i class="fas fa-layer-group"></i>
                </button>
                <button class="tool-btn" id="btnLegend" title="Leyenda">
                    <i class="fas fa-list-ul"></i>
                </button>
                <button class="tool-btn" id="btnBasemap" title="Mapas Base">
                    <i class="fas fa-map"></i>
                </button>
            </div>
        </div>

        <div id="map">
            <!-- BUSCADOR FLOTANTE -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Buscar barrio, sector...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </div>

        <!-- PANEL FLOTANTE DE CAPAS SHAPEFILES -->
        <div class="floating-panel" id="panelLayers">
            <div class="panel-header">
                <span>Capas de Información</span>
                <i class="fas fa-times panel-close" onclick="closePanels()"></i>
            </div>
            <div class="panel-body">
                <label><input type="checkbox" id="chkCuencas" checked> CUENCAS ALCANTARILLADO</label><br><br>
                <label><input type="checkbox" id="chkBarrios" checked> BARRIOS</label><br><br>
                <label><input type="checkbox" id="chkPantanos" checked> PANTANOS</label><br><br>
                <label><input type="checkbox" id="chkRio" checked> RÍO CAUCA</label><br><br>
                <label><input type="checkbox" id="chkCienagas" checked> CIÉNAGAS</label><br><br>
                <label><input type="checkbox" id="chkLagunas" checked> LAGUNAS</label><br><br>
                <label><input type="checkbox" id="chkDrenajes" checked> DRENAJES</label>
            </div>
        </div>

        <!-- PANEL FLOTANTE DE LEYENDA -->
        <div class="floating-panel" id="panelLegend">
            <div class="panel-header">
                <span>Leyenda</span>
                <i class="fas fa-times panel-close" onclick="closePanels()"></i>
            </div>
            <div class="panel-body">
                <div class="legend-item"><span class="legend-line" style="background: rgba(227,26,28,1.0);"></span>CUENCAS ALCANTARILLADO</div>
                <div class="legend-item"><span class="legend-symbol" style="background: rgba(35,35,35,0.3); border: 1px solid #232323;"></span>BARRIOS</div>
                <div class="legend-item"><span class="legend-symbol" style="background: rgba(152,125,183,0.5); border: 1px solid #232323;"></span>PANTANOS</div>
                <div class="legend-item"><span class="legend-symbol" style="background: rgba(184,155,107,0.5); border: 1px solid #232323;"></span>RÍO CAUCA</div>
                <div class="legend-item"><span class="legend-symbol" style="background: rgba(255,139,18,0.5); border: 1px solid #232323;"></span>CIÉNAGAS</div>
                <div class="legend-item"><span class="legend-symbol" style="background: rgba(114,155,111,0.5); border: 1px solid #232323;"></span>LAGUNAS</div>
                <div class="legend-item"><span class="legend-line" style="background: rgba(0,158,226,1.0); height: 2px;"></span>DRENAJES</div>
            </div>
        </div>

        <!-- PANEL FLOTANTE DE MAPAS BASE -->
        <div class="floating-panel" id="panelBasemap">
            <div class="panel-header">
                <span>Mapas Base</span>
                <i class="fas fa-times panel-close" onclick="closePanels()"></i>
            </div>
            <div class="panel-body">
                <label><input type="radio" name="basemap" id="radioSat" checked> GOOGLE SATELLITE</label><br><br>
                <label><input type="radio" name="basemap" id="radioOsm"> OPENSTREETMAP</label>
            </div>
        </div>

        <!-- SCRIPTS DEL PROYECTO -->
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/DRENAJESCACUASIA_2.js"></script>
        <script src="data/LAGUNASCAUCASIA_3.js"></script>
        <script src="data/CIENAGASCAUCASIA_4.js"></script>
        <script src="data/RIOCAUCA_5.js"></script>
        <script src="data/PANTANOSCAUCASIA_6.js"></script>
        <script src="data/BARRIOSCAUCASIA_7.js"></script>
        <script src="data/CUENCASALCANTARILLADO_8.js"></script>
        
        <script>
        var map = L.map('map', { zoomControl:false, maxZoom:28, minZoom:1 });
        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);

        var bounds_group = new L.featureGroup([]);
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        function createPopFunction() {
            return function pop_Feature(feature, layer) {
                var popupContent = '<table>';
                for (var prop in feature.properties) {
                    if (feature.properties[prop] !== null) {
                        popupContent += '<tr><th style="padding-right:8px; font-size:11px; color:#00a859;">' + prop + ':</th><td style="font-size:11px;">' + autolinker.link(String(feature.properties[prop])) + '</td></tr>';
                    }
                }
                popupContent += '</table>';
                layer.bindPopup(popupContent, { maxHeight: 400 });
            };
        }

        // CAPAS BASE
        var layer_OSMStandard_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { minZoom: 1, maxZoom: 28 });
        var layer_GoogleSatellite_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { minZoom: 1, maxZoom: 28 });
        map.addLayer(layer_GoogleSatellite_1);

        // CAPAS VECTORIALES
        var layer_DRENAJESCACUASIA_2 = new L.geoJson(json_DRENAJESCACUASIA_2, { onEachFeature: createPopFunction(), style: function() { return { color: 'rgba(0,158,226,1.0)', weight: 2.0 }; } }).addTo(map);
        var layer_LAGUNASCAUCASIA_3 = new L.geoJson(json_LAGUNASCAUCASIA_3, { onEachFeature: createPopFunction(), style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(114,155,111,1.0)', fillOpacity: 0.5 }; } }).addTo(map);
        var layer_CIENAGASCAUCASIA_4 = new L.geoJson(json_CIENAGASCAUCASIA_4, { onEachFeature: createPopFunction(), style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(255,139,18,1.0)', fillOpacity: 0.5 }; } }).addTo(map);
        var layer_RIOCAUCA_5 = new L.geoJson(json_RIOCAUCA_5, { onEachFeature: createPopFunction(), style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(184,155,107,1.0)', fillOpacity: 0.5 }; } }).addTo(map);
        var layer_PANTANOSCAUCASIA_6 = new L.geoJson(json_PANTANOSCAUCASIA_6, { onEachFeature: createPopFunction(), style: function() { return { color: 'rgba(35,35,35,1.0)', fillColor: 'rgba(152,125,183,1.0)', fillOpacity: 0.5 }; } }).addTo(map);
        var layer_BARRIOSCAUCASIA_7 = new L.geoJson(json_BARRIOSCAUCASIA_7, { onEachFeature: createPopFunction(), style: function() { return { color: 'rgba(35,35,35,1.0)', weight: 1.0, fillOpacity: 0.3 }; } }).addTo(map);
        var layer_CUENCASALCANTARILLADO_8 = new L.geoJson(json_CUENCASALCANTARILLADO_8, { onEachFeature: createPopFunction(), style: function() { return { color: 'rgba(227,26,28,1.0)', weight: 2.0, fillOpacity: 0.3 }; } }).addTo(map);

        bounds_group.addLayer(layer_BARRIOSCAUCASIA_7);
        if (bounds_group.getLayers().length) { map.fitBounds(bounds_group.getBounds()); }

        // CONTROL DE PANELES FLOTANTES
        function closePanels() {
            document.querySelectorAll('.floating-panel').forEach(p => p.classList.remove('active'));
        }

        function togglePanel(panelId) {
            var panel = document.getElementById(panelId);
            var isCurrentActive = panel.classList.contains('active');
            closePanels();
            if (!isCurrentActive) { panel.classList.add('active'); }
        }

        document.getElementById('btnLayers').onclick = function() { togglePanel('panelLayers'); };
        document.getElementById('btnLegend').onclick = function() { togglePanel('panelLegend'); };
        document.getElementById('btnBasemap').onclick = function() { togglePanel('panelBasemap'); };

        // VINCULACIÓN DE CHECKBOXES CON CAPAS
        document.getElementById('chkCuencas').onchange = function() { this.checked ? map.addLayer(layer_CUENCASALCANTARILLADO_8) : map.removeLayer(layer_CUENCASALCANTARILLADO_8); };
        document.getElementById('chkBarrios').onchange = function() { this.checked ? map.addLayer(layer_BARRIOSCAUCASIA_7) : map.removeLayer(layer_BARRIOSCAUCASIA_7); };
        document.getElementById('chkPantanos').onchange = function() { this.checked ? map.addLayer(layer_PANTANOSCAUCASIA_6) : map.removeLayer(layer_PANTANOSCAUCASIA_6); };
        document.getElementById('chkRio').onchange = function() { this.checked ? map.addLayer(layer_RIOCAUCA_5) : map.removeLayer(layer_RIOCAUCA_5); };
        document.getElementById('chkCienagas').onchange = function() { this.checked ? map.addLayer(layer_CIENAGASCAUCASIA_4) : map.removeLayer(layer_CIENAGASCAUCASIA_4); };
        document.getElementById('chkLagunas').onchange = function() { this.checked ? map.addLayer(layer_LAGUNASCAUCASIA_3) : map.removeLayer(layer_LAGUNASCAUCASIA_3); };
        document.getElementById('chkDrenajes').onchange = function() { this.checked ? map.addLayer(layer_DRENAJESCACUASIA_2) : map.removeLayer(layer_DRENAJESCACUASIA_2); };

        // VINCULACIÓN DE MAPAS BASE
        document.getElementById('radioSat').onchange = function() { if (this.checked) { map.addLayer(layer_GoogleSatellite_1); map.removeLayer(layer_OSMStandard_0); } };
        document.getElementById('radioOsm').onchange = function() { if (this.checked) { map.addLayer(layer_OSMStandard_0); map.removeLayer(layer_GoogleSatellite_1); } };
        </script>
    </body>
</html>
